name: Deploy to Fly

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "pricing.md"
      - "llms.txt"
      - "x402.json"

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'bshelby88/opensea-data-x402' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No package-lock.json in this repo (recovered dist layout) — plain install.
      - name: Install deps + run tests
        working-directory: recovered/server
        run: |
          npm install --no-package-lock --ignore-scripts
          npm test

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy (overlay build FROM live image digest)
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify /health after deploy
        run: |
          timeout 120 bash -c 'until curl -fsS -m 20 https://opensea-data-x402.fly.dev/health; do sleep 5; done' && echo "Health OK: responded within 120s" || { echo "::error::opensea-data-x402 did not respond on /health within 120s of deploy"; exit 1; }

      - name: Verify 402index verification file after deploy
        run: |
          BODY=$(curl -fsS -m 20 https://opensea-data-x402.fly.dev/.well-known/402index-verify.txt)
          echo "verify body: $BODY"
          if [ "$BODY" != "3223e7936cc47829b4e816bcc8bac1b845a26337e740984d0e76526eaff3ab84" ]; then
            echo "::error::/.well-known/402index-verify.txt mismatch"; exit 1
          fi
          echo "Verify OK: exact hash served"